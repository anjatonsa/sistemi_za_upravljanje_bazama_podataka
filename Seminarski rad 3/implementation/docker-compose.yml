version: "3.8"

services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-baze-proj3
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      KAFKA_LOG_RETENTION_BYTES: 209715200
      KAFKA_LOG_SEGMENT_BYTES: 10485760
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-baze-proj3
    ports:
      - "8083:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse-baze-proj3
    ports:
      - "8123:8123"   
      - "9000:9000"   
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse_data-baze-proj3:/var/lib/clickhouse
    depends_on:
      kafka:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  producer:
    build: ./producer
    container_name: producer-baze-proj3
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC=sensor_events
      - EVENTS_PER_SECOND=5

volumes:
  kafka_data-baze-proj3:
  clickhouse_data-baze-proj3:
